# Общая политика логов: stdout (pino/nginx/postgres) → docker json-file
# с ротацией. Ограниченный объём = ограниченный срок хранения журналов
# (в т.ч. PII: ip в rate-limit/ws-логах) —
# требуется правовой частью (Политика конфиденциальности, раздел 7).
# YAML-якорь подставляется в каждый сервис ниже.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: edem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: edem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edem -d edem"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: "Europe/Moscow"
      DATABASE_URL: postgresql://edem:${POSTGRES_PASSWORD}@db:5432/edem?schema=public&connection_limit=10
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Telegram Mini Apps: токен бота для валидации initData
      # (POST /api/v1/auth/telegram). Обязателен: без него Telegram-вход
      # закрыт, а staging-стенд бессмысленен.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      # Хосты Telegram-фронта (comma-separated): Host из списка получает
      # telegram-app/dist. Пример: tg-edem.binetc.fun.
      # Обязателен: без него приложение отвечает 404.
      TELEGRAM_HOSTS: ${TELEGRAM_HOSTS:?TELEGRAM_HOSTS is required}
      # Окно свежести initData, секунды (дефолт backend 3600).
      TG_INIT_DATA_TTL_SECONDS: ${TG_INIT_DATA_TTL_SECONDS:-3600}
      # TG-доставка уведомлений: kill-switch (дефолт true) и окно дедупа, мс.
      TELEGRAM_DELIVERY_ENABLED: ${TELEGRAM_DELIVERY_ENABLED:-true}
      TG_NOTIFICATION_DEDUPE_WINDOW_MS: ${TG_NOTIFICATION_DEDUPE_WINDOW_MS:-60000}
      # Секрет вебхука бота (POST /bot/webhook/:secret, bot-api-approval
      # package §4.2): обязателен в production (secretEnv), выдаётся вместе
      # с токеном бота, ротация — перевыпуском URL вебхука.
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      # URL Telegram Mini App для кнопки «Открыть» в сообщениях бота
      # (web_app.url в sendMessage). Пусто = сообщения без кнопки.
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALLOW_DEV_AUTH: "false"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # Rate limits (дефолты совпадают с backend/src/env.ts)
      # TG-auth: в compose проброшен для override в локальном .env
      # (dev-стенд: TG_AUTH_RATE_MAX=100000; прод — дефолт 5, не менять).
      TG_AUTH_RATE_WINDOW_MS: ${TG_AUTH_RATE_WINDOW_MS:-300000}
      TG_AUTH_RATE_MAX: ${TG_AUTH_RATE_MAX:-5}
      REFRESH_RATE_WINDOW_MS: ${REFRESH_RATE_WINDOW_MS:-600000}
      REFRESH_RATE_MAX: ${REFRESH_RATE_MAX:-10}
      PUBLIC_READ_RATE_WINDOW_MS: ${PUBLIC_READ_RATE_WINDOW_MS:-60000}
      PUBLIC_READ_RATE_MAX: ${PUBLIC_READ_RATE_MAX:-100}
      MUTATION_RATE_WINDOW_MS: ${MUTATION_RATE_WINDOW_MS:-60000}
      MUTATION_RATE_MAX: ${MUTATION_RATE_MAX:-30}
      CREATE_TRIP_RATE_WINDOW_MS: ${CREATE_TRIP_RATE_WINDOW_MS:-86400000}
      CREATE_TRIP_RATE_MAX: ${CREATE_TRIP_RATE_MAX:-10}
      CANCEL_TRIP_RATE_WINDOW_MS: ${CANCEL_TRIP_RATE_WINDOW_MS:-86400000}
      CANCEL_TRIP_RATE_MAX: ${CANCEL_TRIP_RATE_MAX:-20}
      CREATE_BOOKING_RATE_WINDOW_MS: ${CREATE_BOOKING_RATE_WINDOW_MS:-86400000}
      CREATE_BOOKING_RATE_MAX: ${CREATE_BOOKING_RATE_MAX:-20}
      CANCEL_BOOKING_RATE_WINDOW_MS: ${CANCEL_BOOKING_RATE_WINDOW_MS:-86400000}
      CANCEL_BOOKING_RATE_MAX: ${CANCEL_BOOKING_RATE_MAX:-20}
      # Завершение поездок водителем (PATCH /trips/:id/complete).
      COMPLETE_TRIP_RATE_WINDOW_MS: ${COMPLETE_TRIP_RATE_WINDOW_MS:-86400000}
      COMPLETE_TRIP_RATE_MAX: ${COMPLETE_TRIP_RATE_MAX:-20}
      # User-based: частые лёгкие действия по аккаунту (в сутки).
      PROFILE_UPDATE_RATE_WINDOW_MS: ${PROFILE_UPDATE_RATE_WINDOW_MS:-86400000}
      PROFILE_UPDATE_RATE_MAX: ${PROFILE_UPDATE_RATE_MAX:-50}
      NOTIFICATION_READ_RATE_WINDOW_MS: ${NOTIFICATION_READ_RATE_WINDOW_MS:-86400000}
      NOTIFICATION_READ_RATE_MAX: ${NOTIFICATION_READ_RATE_MAX:-100}
      REVIEWS_READ_RATE_WINDOW_MS: ${REVIEWS_READ_RATE_WINDOW_MS:-86400000}
      REVIEWS_READ_RATE_MAX: ${REVIEWS_READ_RATE_MAX:-100}
      FEEDBACK_READ_RATE_WINDOW_MS: ${FEEDBACK_READ_RATE_WINDOW_MS:-86400000}
      FEEDBACK_READ_RATE_MAX: ${FEEDBACK_READ_RATE_MAX:-100}
      # Админ-панель: пусто = панель выключена (все запросы 403).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_JWT_TTL_SECONDS: ${ADMIN_JWT_TTL_SECONDS:-43200}
      # Лимит GET-эндпоинтов админки (IP-based, выше публичного read-лимитера).
      ADMIN_READ_RATE_WINDOW_MS: ${ADMIN_READ_RATE_WINDOW_MS:-60000}
      ADMIN_READ_RATE_MAX: ${ADMIN_READ_RATE_MAX:-300}
      # Анти-брутфорс логина админки (audit: env/compose parity — переменные
      # читаются env.ts и задокументированы в backend/.env.example, но не
      # пробрасывались прод-compose, молча игнорируя настройку).
      ADMIN_LOGIN_RATE_WINDOW_MS: ${ADMIN_LOGIN_RATE_WINDOW_MS:-300000}
      ADMIN_LOGIN_RATE_MAX: ${ADMIN_LOGIN_RATE_MAX:-10}
      # Метрики: пусто = /metrics закрыт (403). Прокси может отдать токен
      # сборщику метрик через заголовок Authorization.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Backend доступен только через внешний reverse proxy. Не доверяем
      # произвольным forwarding headers от прямых клиентов.
      TRUST_PROXY: "false"
    ports:
      # Адрес публикации настраивается через BACKEND_BIND_ADDR (root .env).
      # Дефолт 127.0.0.1 — для reverse proxy на том же хосте.
      # Для прокси на отдельном хосте установите BACKEND_BIND_ADDR=0.0.0.0
      # и ограничьте порт 3000 firewall-правилами (только Traefik/nginx).
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Адрес публикации настраивается через WEBAPP_BIND_ADDR (root .env).
      # Дефолт 127.0.0.1 — для reverse proxy на том же хосте.
      # Для прокси на отдельном хосте установите WEBAPP_BIND_ADDR=0.0.0.0
      # и ограничьте порт 3014 firewall-правилами.
      - "${WEBAPP_BIND_ADDR:-127.0.0.1}:3014:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
