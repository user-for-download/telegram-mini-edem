# webapp/nginx.conf
# Nginx админ-панели (webapp/dist): отдаёт SPA и проксирует /api на backend
# внутри docker-сети (same-origin — иначе httpOnly cookie не сработают).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers админ-SPA. `always` — чтобы заголовки были и на 4xx/5xx.
  # CSP: только свои скрипты/стили; API и WS — same-origin через этот же nginx.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://t.me https://telegram.org https://*.telegram.org https://*.telegram-cdn.org; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # SPA fallback: клиентские маршруты TanStack Router (/login, /users, ...)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Хешированные ассеты vite — кэшируем надолго.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    # add_header не наследуется, если в location есть свой add_header —
    # поэтому security headers повторяем здесь.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://t.me https://telegram.org https://*.telegram.org https://*.telegram-cdn.org; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # API — на backend. URI не переписываем: /api/v1/... уходит как есть.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перезаписываем, а не дополняем: левый (первый) хоп X-Forwarded-For
    # подделывается клиентом (см. backend/src/middleware/rateLimit.ts).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Не пробрасываем клиентский X-Forwarded-Proto: backend в production
    # всё равно ставит Secure, а подделка заголовка больше не влияет.
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
